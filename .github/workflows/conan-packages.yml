name: Conan Packages CI

on:
  push:
    paths:
      - "conan/packages/**"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        language: [c, cpp, both]
        api_config:
          # OpenGL
          - { api: gl, version: "1.0" }
          - { api: gl, version: "1.1" }
          - { api: gl, version: "1.2" }
          - { api: gl, version: "1.3" }
          - { api: gl, version: "1.4" }
          - { api: gl, version: "2.0" }
          - { api: gl, version: "2.1" }
          - { api: gl, version: "3.0" }
          - { api: gl, version: "3.1" }
          - { api: gl, version: "3.2" }
          - { api: gl, version: "3.3" }
          - { api: gl, version: "4.0" }
          - { api: gl, version: "4.1" }
          - { api: gl, version: "4.2" }
          - { api: gl, version: "4.3" }
          - { api: gl, version: "4.4" }
          - { api: gl, version: "4.5" }
          - { api: gl, version: "4.6" }
          # OpenGL ES 1.x
          - { api: gles1, version: "1.0" }
          - { api: gles1, version: "1.1" }
          # OpenGL ES 2.0+
          - { api: gles2, version: "2.0" }
          - { api: gles2, version: "3.0" }
          - { api: gles2, version: "3.1" }
          - { api: gles2, version: "3.2" }
          # OpenGL SC
          - { api: glsc2, version: "2.0" }

    runs-on: ${{ matrix.os }}
    name: "${{ matrix.api_config.api }}:${{ matrix.api_config.version }} / ${{ matrix.language }} / ${{ matrix.os }}"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: |
          pip install conan
          conan profile detect

      - name: Build package
        run: >
          conan create conan/packages/glaze --build=missing
          -o "glaze/*:apis=${{ matrix.api_config.api }}:${{ matrix.api_config.version }}"
          -o "glaze/*:language=${{ matrix.language }}"
